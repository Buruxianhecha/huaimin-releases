.model-back svg{width:23px;height:23px}
.model-head-pill{min-width:110px;border:1px solid #66646a;background:#292a2e;border-radius:26px;padding:10px 19px}
.model-head-pill strong{display:block;font-size:21px;line-height:1.35}.model-head-pill small{display:block;color:#a7a6b2;font-size:12px;margin-top:5px}
.model-panel{margin:16px;padding:18px 17px 20px;border:1px solid #43434a;border-radius:24px;background:linear-gradient(135deg,#242931,#1d222c 65%,#26282b)}
.model-section-title{color:#8bd2e9;font-size:14px;font-weight:700;margin:0 0 17px}
.model-provider-grid{display:flex;gap:9px;flex-wrap:wrap}
.model-chip{background:#ffffff12;color:#e6e7ed;border:1px solid #ffffff11;border-radius:30px;min-height:43px;padding:9px 14px;font-size:15px}
.model-chip.active{background:#0a789b;color:#fff;border-color:#118bb3;box-shadow:0 5px 18px #087e9240}
.model-chip.auto{width:auto;margin-top:2px}
.model-panel label.model-floating{display:block;color:#b1b7c3;font-size:13px;margin:18px 0 7px}
.model-field{display:block;width:100%;box-sizing:border-box;min-height:53px;border:1px solid #696a78;border-radius:9px;background:#ffffff09;color:#f5f5f8;padding:13px 14px;font-size:16px;outline:none}
.model-field:focus{border-color:#84c9e5;box-shadow:0 0 0 2px #84c9e520}
.model-field[disabled]{opacity:.55}
.model-key-hint{color:#9fa8b6;font-size:12px;line-height:1.7;margin-top:11px}
.model-key-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.model-inline-button{border-radius:24px;background:#ffffff17;color:#f2f2f4;padding:10px 16px;white-space:nowrap}
.model-inline-button.primary{background:#087ba4}
.model-spare-row{margin:12px 0}.model-spare-btn{border-radius:22px;background:#ffffff14;color:#dce6f1;padding:12px 16px;font-size:14px}
.model-actions{display:flex;gap:8px;margin-top:18px}.model-actions button{flex:1;padding:13px 8px;font-size:14px;border-radius:25px;background:#353a45;color:#fff}.model-actions button.primary{background:#087ba4}
.model-result{min-height:20px;line-height:1.55;color:#b7c9d5;font-size:12px;margin:12px 0 0}
.model-list{display:grid;gap:7px;margin-top:12px;max-height:230px;overflow:auto}
.model-list button{border-radius:12px;background:#35414b;text-align:left;padding:12px;color:#e6eef9;font-size:13px;overflow-wrap:anywhere}
.model-info{font-size:12px;line-height:1.7;color:#afb4c0;margin-top:13px}


/* v0.1.10: genuine local feedback form and contextual help center. */
.support-page{min-height:100%;background:#09090a;padding-bottom:115px;color:#f6f5f7}
.support-top{display:flex;align-items:center;gap:16px;min-height:70px;padding:calc(15px + var(--native-status-clearance,44px)) 20px 15px;background:#1d1d1f;border-bottom:1px solid #343439}
.support-back{width:43px;height:43px;border-radius:50%;background:#313136;color:#fff;display:grid;place-items:center;font-size:26px}
.support-top strong{font-size:22px;font-weight:650}
.support-card{margin:20px 17px;background:#1f1f22;border-radius:22px;padding:21px 18px}
.support-card h2{font-size:21px;margin:0 0 10px;font-weight:670}
.support-card p{font-size:14px;line-height:1.75;color:#acadb7}
.feedback-label{display:block;margin:21px 0 9px;font-size:14px;color:#d7d7dc}
.feedback-field{box-sizing:border-box;width:100%;border:1px solid #4b4b51;border-radius:12px;background:#2b2b30;color:white;padding:13px 14px;font-size:15px;min-height:48px;outline:0}
.feedback-field:focus{border-color:#fb8b69}
.feedback-field::placeholder{color:#888991}
.feedback-textarea{min-height:170px;resize:vertical;line-height:1.55}
.feedback-counter{text-align:right;color:#9999a3;font-size:12px;margin-top:6px}
.feedback-submit{display:block;background:#f67856;color:white;font-size:16px;font-weight:700;width:100%;padding:15px;margin-top:20px;border-radius:13px}
.feedback-note{margin:14px 0 0;font-size:12px;color:#ababaf;line-height:1.65}
.feedback-entry{border-bottom:1px solid #38383c;padding:15px 0}
.feedback-entry:last-child{border:0}
.feedback-entry-head{display:flex;justify-content:space-between;gap:8px}
.feedback-entry small{color:#92929b;font-size:12px}
.feedback-entry p{margin:7px 0;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.feedback-entry button{background:#35353b;padding:9px 13px;border-radius:10px;color:#f4f4f5;font-size:12px}
.help-faq{border-top:1px solid #38383c;padding:2px 0}
.help-faq:last-child{border-bottom:1px solid #38383c}
.help-faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:17px 0;font-size:15px}
.help-faq summary::-webkit-details-marker{display:none}
.help-faq summary::after{content:"⌄";color:#a8a8b2;font-size:19px}
.help-faq[open] summary::after{content:"⌃"}
.help-answer{white-space:pre-line;color:#babbc2;font-size:13px;line-height:1.8;padding:0 2px 16px}
.help-footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.help-footer button{flex:1;background:#36363b;border-radius:12px;padding:12px;color:#fff}
.help-footer .primary{background:#f67856}

function exportSelectedTransactions(){const book=ioBookId||currBook().id;let rows=data.transactions.filter(t=>t.bookId===book);const y=today.getFullYear(),m=today.getMonth();if(ioScope==='month'){const prefix=ymd(y,m+1,1).slice(0,7);rows=rows.filter(x=>x.date.startsWith(prefix))}else if(ioScope==='quarter'){const start=ymd(y,Math.floor(m/3)*3+1,1),end=ymd(y,Math.floor(m/3)*3+4,1);rows=rows.filter(x=>x.date>=start&&x.date<end)}else if(ioScope==='custom'){if(ioStart)rows=rows.filter(x=>x.date>=ioStart);if(ioEnd)rows=rows.filter(x=>x.date<=ioEnd)}return [...rows].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt)}
function csvEscape(v){const raw=String(v??'');const s=/^[\s\uFEFF]*[=+\-@\t\r]/.test(raw)?"'"+raw:raw;return /[,"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function generateCsv(rows){const header=['交易时间','收支类型','金额','类别','商家','备注','账户','成员','交易单号'];const lines=[header,...rows.map(t=>[t.date,t.kind==='income'?'收入':'支出',t.amount.toFixed(2),t.category,t.merchant||'',t.note||'',data.assetAccounts?.find(a=>a.id===t.accountId)?.name||'',t.member||'',t.sourceRef||''])];return '\uFEFF'+lines.map(c=>c.map(csvEscape).join(',')).join('\r\n')+'\r\n'}
function deliverText(name,body,mime='text/csv',share=false,email=''){const b64=btoa(Array.from(new TextEncoder().encode(body),b=>String.fromCharCode(b)).join(''));if(window.NativeBridge){if(share&&typeof NativeBridge.shareCsv==='function'){NativeBridge.shareCsv(name,b64,email);return true}if(!share&&typeof NativeBridge.saveTextFile==='function'){NativeBridge.saveTextFile(name,b64,mime);return true}}if(share){toast('请使用安卓安装版通过邮件应用分享');return false}const url=URL.createObjectURL(new Blob([body],{type:mime+';charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('文件已准备下载');return true}
function parseCsv(content){const rows=[];let row=[],v='',quoted=false;for(let i=0;i<content.length;i++){const c=content[i];if(c==='"'){if(quoted&&content[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\r'||c==='\n')&&!quoted){row.push(v);v='';if(row.some(x=>x.trim()))rows.push(row);row=[];if(c==='\r'&&content[i+1]==='\n')i++}else v+=c}if(quoted)throw Error('CSV 引号未闭合');row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function normalizeHeader(v){return String(v??'').replace(/[\uFEFF\s\u200b（）():：_\-／/]/g,'').toLowerCase()}
function findHeader(rows){const rules={date:['交易时间','交易创建时间','创建时间','时间','日期','入账时间','交易日期','记账时间','发生时间'],type:['收支类型','收支','类型','交易类型','资金流向','收支方向','交易方向'],amount:['金额','交易金额','金额元','收支金额','金额人民币','实际支付','实付金额','收付款金额'],category:['类别','分类','一级分类','交易分类','商品分类'],merchant:['交易对方','商家','商户','交易对象','商户名称','对方','收款方'],note:['备注','商品','商品说明','商品名称','交易说明','说明','用途','摘要','内容'],reference:['交易单号','交易订单号','交易号','订单号','商户订单号','交易流水号'],status:['当前状态','交易状态','状态'],account:['账户','支付方式','支付账户'],member:['成员','记账人']};for(let k=0;k<Math.min(rows.length,35);k++){const hs=rows[k].map(normalizeHeader),col={};for(const [field,list] of Object.entries(rules)){const idx=hs.findIndex(h=>list.some(name=>h===normalizeHeader(name)));if(idx>=0)col[field]=idx}if(col.date!==undefined&&col.amount!==undefined)return {index:k,columns:col}}throw Error('未找到“时间”和“金额”列，请按导入模板整理文件')}
function amountNumber(v){const n=Number(String(v??'').replace(/[￥¥,，\s]/g,'').replace(/^\((.*)\)$/,'-$1'));return Number.isFinite(n)?n:NaN}
function parseTxnDate(v){let str=String(v??'').trim();if(/^\d{4,6}(\.\d+)?$/.test(str)){const num=Number(str);if(num>=1&&num<200000){const dt=new Date(Date.UTC(1899,11,30)+Math.floor(num)*86400000);str=ymd(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}}const m=str.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(!m)return '';const date=ymd(Number(m[1]),Number(m[2]),Number(m[3]));const parsed=new Date(date+'T12:00:00');return !safeDate(date)||parsed.getFullYear()!==Number(m[1])||parsed.getMonth()+1!==Number(m[2])||parsed.getDate()!==Number(m[3])?'':date}
function estimateCategory(raw,kind,note){const v=String(raw||'').trim();if(v)return v.slice(0,24);const hints=kind==='income'?incomeCats:expenseCats;return hints.find(([n])=>String(note).includes(n))?.[0]||'其他'}
function normalizeTableRows(rows,source){const head=findHeader(rows),col=head.columns,records=[],invalid=[],statuses=['已关闭','交易关闭','已取消','交易失败','支付失败','已撤销'];for(let i=head.index+1;i<rows.length;i++){const row=rows[i];if(!row.some(x=>String(x||'').trim()))continue;const get=k=>String(col[k]===undefined?'':row[col[k]]??'').trim();const date=parseTxnDate(get('date')),num=amountNumber(get('amount'));if(!date||!Number.isFinite(num)||!num||Math.abs(num)>1e10){invalid.push(i+1);continue}if(statuses.some(v=>get('status').includes(v)))continue;const type=get('type');if(/不计|转账到|账户互转/.test(type))continue;const kind=/退款|收入|转入|收款|入账|income|refund/i.test(type+' '+get('status'))?'income':/支出|转出|付款|支付|expense/i.test(type)?'expense':num<0?'expense':'expense';const note=get('note'),merchant=get('merchant'),category=estimateCategory(get('category'),kind,note),rawRef=get('reference');const ref=rawRef?(source+'|'+rawRef).slice(0,100):'';records.push({date,kind,amount:Math.round(Math.abs(num)*100)/100,category,merchant:merchant.slice(0,50),note:note.slice(0,100),accountName:get('account').slice(0,30),member:get('member').slice(0,30),sourceRef:ref})}if(!records.length)throw Error('没有可导入的有效账单，请检查日期、金额和收支类型');if(records.length>5000)throw Error('一次最多导入 5000 笔账单');return {records,invalid,header:head.index+1}}
function duplicateKey(t){return t.sourceRef?'ref:'+t.sourceRef:['raw',t.date,t.kind,t.amount,t.category,t.note||'',t.merchant||'',t.accountId||''].join('|')}
function prepareImport(records,file){const seen=new Set(data.transactions.filter(t=>t.bookId===currBook().id).map(duplicateKey));const accepted=[],skipped=[];for(const r of records){let accId='';if(r.accountName){const a=(data.assetAccounts||[]).find(a=>a.name===r.accountName);accId=a?.id||''}const item={id:'imp_'+Date.now()+'_'+Math.random().toString(36).slice(2,10),bookId:currBook().id,kind:r.kind,amount:r.amount,date:r.date,category:r.category,note:r.note||'',merchant:r.merchant||'',accountId:accId,member:r.member||'',sourceRef:r.sourceRef||'',createdAt:Date.now()};const key=duplicateKey(item);if(seen.has(key)){skipped.push(item);continue}seen.add(key);accepted.push(item)}return {accepted,skipped,file}}
function showImportPreview(loaded,file){ioPreview={...prepareImport(loaded.records,file),invalid:loaded.invalid};const p=ioPreview;sheet('确认导入账单',`<div class="io-preview" style="margin:6px 0"><div class="io-row"><b>${esc(file)}</b></div><div class="io-sub">目标账本：${esc(currBook().name)}</div><div class="io-row"><span>准备新增</span><strong>${p.accepted.length} 笔</strong></div><div class="io-row"><span>疑似重复</span><strong>${p.skipped.length} 笔</strong></div><div class="io-row"><span>无法识别</span><strong>${p.invalid.length} 行</strong></div>${p.accepted.slice(0,4).map(t=>`<div class="io-preview-item"><span>${t.date} · ${esc(t.category)}</span><span>${t.kind==='expense'?'-':'+'}¥${money(t.amount)}</span></div>`).join('')}</div><p class="io-muted">请核对样例。确认后仅向当前账本追加有效记录，不会清空已有数据。</p><div class="action-row"><button class="light-btn" data-action="close">取消</button><button class="gold-button" data-action="io-confirm-import" ${p.accepted.length?'':'disabled'}>确认导入 ${p.accepted.length} 笔</button></div>`)}
async function readSheetFile(file){if(file.size>10*1024*1024)throw Error('文件超过 10 MB');const ext=(file.name.split('.').pop()||'').toLowerCase();if(ext==='xls')throw Error('旧版 XLS 暂不支持，请转换为 XLSX 或 CSV');if(ext==='xlsx'){if(!window.NativeBridge||typeof NativeBridge.readXlsx!=='function')throw Error('Excel 解析需要安装安卓 APP，请使用手机 APP 或转换为 CSV');const bin=new Uint8Array(await file.arrayBuffer());const parts=[];for(let i=0;i<bin.length;i+=8192)parts.push(String.fromCharCode(...bin.subarray(i,i+8192)));const b64=btoa(parts.join(''));ioPreview=null;toast('正在读取 Excel，请稍候…');NativeBridge.readXlsx(b64,file.name);return}if(ext!=='csv')throw Error('请选择 CSV 或 XLSX 文件');const bytes=await file.arrayBuffer();let text=new TextDecoder('utf-8',{fatal:false}).decode(bytes);if(text.includes('\uFFFD')){try{text=new TextDecoder('gb18030').decode(bytes)}catch{}}showImportPreview(normalizeTableRows(parseCsv(text),file.name),file.name)}

function currentAssetValue(account){const delta=data.transactions.filter(t=>t.accountId===account.id).reduce((v,t)=>v+(t.kind==='income'?t.amount:-t.amount),0);return Number(account.initialBalance||0)+delta}
function accountNetValue(a){return currentAssetValue(a)+(accountPreferences().includeReimbursement?Number(a.pendingReimbursement||0):0)}
function accountTotals(accounts){const asset=accounts.filter(a=>!a.isDebt).reduce((v,a)=>v+accountNetValue(a),0);const debt=accounts.filter(a=>a.isDebt).reduce((v,a)=>v+Math.abs(accountNetValue(a)),0);return {asset,debt}}

function planTasks(windowKey){const todayMs=new Date(todayISO+'T12:00:00').getTime();const range=windowKey==='today'?1:windowKey==='week'?7:windowKey==='month'?30:0;return (data.tasks||[]).filter(t=>t.bookId===currBook().id).filter(t=>{const due=new Date(t.dueDate+'T12:00:00').getTime();if(windowKey==='year')return new Date(t.dueDate+'T12:00:00').getFullYear()===today.getFullYear();return due>=todayMs&&due<todayMs+range*86400000})}
function renderPlansPage(){const windows=[['today','今天','#fa5048'],['week','近7天','#ff7652'],['month','近30天','#778aff'],['year','今年','#3fcbb2']];return `<div class="main-screen"><header class="main-top"><span class="main-top-title">计划</span><div class="main-top-right"><button data-action="add-task" aria-label="添加计划">${icon('plus')}</button></div></header><div class="plan-dash">${windows.map(([id,label,color])=>`<button class="plan-tile ${planWindow===id?'selected':''}" style="--plan-color:${color}" data-action="select-plan-window" data-window="${id}"><span><i></i>${label}</span><b>${planTasks(id).length}</b></button>`).join('')}</div><div class="task-board">${planTasks(planWindow).length?`<div class="task-board-head"><span>待办计划 (${planTasks(planWindow).filter(t=>!t.done).length} 项未完成)</span><span>点击勾选完成</span></div>${planTasks(planWindow).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(t=>`<button class="task-item ${t.done?'done':''}" data-action="toggle-task" data-id="${esc(t.id)}"><span class="task-circle">${t.done?'☑':'◯'}</span><span class="task-name">${esc(t.name)}<small>${esc(t.dueDate)} · ${t.done?'已完成':'待完成'}</small></span><span data-action="edit-task" data-id="${esc(t.id)}" style="font-size:21px;color:#8c8c91;padding:9px" aria-label="编辑计划">⋯</span></button>`).join('')}`:'<div class="report-empty" style="margin-top:36px">这个时间段暂无计划<br>点击右上角 ＋ 创建待办事项</div>'}</div></div>`}
function reportTransactions(){if(reportPeriod==='all')return txAll();const year=viewMonth.getFullYear()+Math.trunc((viewMonth.getMonth()+reportOffset)/12),month=((viewMonth.getMonth()+reportOffset)%12+12)%12+1;return txAll().filter(t=>reportPeriod==='year'?t.date.slice(0,4)===String(year):t.date.slice(0,7)===ymd(year,month,1).slice(0,7))}
function reportDates(){const y=viewMonth.getFullYear()+Math.floor((viewMonth.getMonth()+reportOffset)/12),m=((viewMonth.getMonth()+reportOffset)%12+12)%12+1;if(reportPeriod==='month')return {label:`${y}/${String(m).padStart(2,'0')}`,count:new Date(y,m,0).getDate(),index:t=>Number(t.date.slice(8,10))-1,axis:i=>`${i+1}日`};if(reportPeriod==='year')return {label:`${y}年`,count:12,index:t=>Number(t.date.slice(5,7))-1,axis:i=>`${i+1}月`};const years=txAll().map(t=>Number(t.date.slice(0,4))),from=Math.min(y,...years),to=Math.max(y,...years);return {label:'全部时间',count:Math.min(48,to-from+1),index:t=>Number(t.date.slice(0,4))-from,axis:i=>`${from+i}年`}}
function reportSeries(kind){const d=reportDates();const vals=Array.from({length:d.count},()=>0);reportTransactions().forEach(t=>{const i=d.index(t);if(i>=0&&i<vals.length)vals[i]+=kind==='balance'?(t.kind==='income'?t.amount:-t.amount):(t.kind===kind?t.amount:0)});return vals}
function svgTrend(kind){const vals=reportSeries(kind),w=348,h=218,pad=15,top=14,bottom=36,min=Math.min(0,...vals),max=Math.max(1,...vals),range=max-min;const y=v=>top+(h-top-bottom)*(max-v)/range,x=i=>pad+(w-2*pad)*(vals.length===1?.5:i/(vals.length-1));const clr=kind==='expense'?'#40cdb4':kind==='income'?'#ff8055':'#778bff';const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');const ticks=[0,1,2,3,4].map(i=>{const yy=top+i*(h-top-bottom)/4;return `<line x1="${pad}" y1="${yy}" x2="${w-pad}" y2="${yy}" stroke="#37373b" stroke-width=".8" stroke-dasharray="3 6"/>`}).join('');const shapes=reportGraph==='bar'?vals.map((v,i)=>`<rect x="${x(i)-Math.max(1,Math.min(8,158/vals.length))}" width="${Math.max(2,Math.min(16,316/vals.length))}" y="${y(Math.max(0,v))}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="1" fill="${clr}"/>`).join(''):`<path d="${path}" fill="none" stroke="${clr}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;const d=reportDates(),tickIndex=[0,Math.floor((vals.length-1)/4),Math.floor((vals.length-1)/2),Math.floor((vals.length-1)*3/4),vals.length-1].filter((v,i,a)=>a.indexOf(v)===i);return `<svg class="report-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${kind==='expense'?'支出':kind==='income'?'收入':'结余'}趋势">${ticks}${shapes}${tickIndex.map(i=>`<text x="${x(i)}" y="${h-12}" fill="#7c7c82" text-anchor="middle" font-size="11">${d.axis(i)}</text>`).join('')}</svg>`}
function renderReportsPage(){const d=reportDates(),tx=reportTransactions(),sum=totals(tx),tabs=['趋势','大类','小类','成员','账户','商家'];const available=tabs.find(x=>x===reportTab)||'趋势';const reportCards=available==='趋势'?['expense','income','balance'].map(kind=>{const value=kind==='expense'?sum.expense:kind==='income'?sum.income:sum.income-sum.expense;return `<section class="report-card"><div class="report-card-title"><span>${kind==='expense'?'支出':kind==='income'?'收入':'结余'}趋势</span><span><button data-action="graph-mode" data-mode="line" aria-label="折线图">⌁</button><button data-action="graph-mode" data-mode="bar" aria-label="柱形图">☷</button></span></div>${svgTrend(kind)}<div class="report-card-foot">${d.label}，${kind==='balance'?'总结余':'共计'+tx.filter(t=>t.kind===kind).length+'笔，总'+(kind==='expense'?'支出':'收入')} <strong>${money(value)}</strong></div></section>`}).join(''):(()=>{let groups={};tx.forEach(t=>{let key=available==='账户'?(data.assetAccounts||[]).find(a=>a.id===t.accountId)?.name||'未选择账户':available==='商家'?(t.merchant||'未填写商家'):available==='成员'?(t.member||'默认成员'):available==='小类'?t.category:(t.kind==='income'?'收入 · ':'支出 · ')+t.category;groups[key]=(groups[key]||0)+(t.kind==='expense'?-1:1)*t.amount});const entries=Object.entries(groups).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));const highest=Math.max(1,...entries.map(v=>Math.abs(v[1])));return `<section class="report-card"><div class="report-card-title">${available}分析 <span class="report-small">${entries.length}项</span></div>${entries.length?entries.map(([name,val])=>`<div class="report-breakdown-item"><div style="flex:1"><div>${esc(name)}</div><div class="bar" style="width:${Math.max(2,Math.abs(val)/highest*100)}%"></div></div><span>${money(val)}</span></div>`).join(''):'<div class="report-empty">该时间段暂无账单数据</div>'}</section>`})();return `<div class="main-screen report-screen"><div class="report-top"><div class="report-periods">${[['all','全部'],['year','年'],['month','月']].map(([id,txt])=>`<button data-action="report-perio function shareFeedbackRecord(item){
 if(!item)return toast('找不到反馈记录');
 const body='《知余记账》意见反馈\n类型：'+item.type+'\n标题：'+item.title+'\n时间：'+item.date+'\n\n'+item.body+'\n\n版本：v0.1.10';
 if(window.NativeBridge&&typeof window.NativeBridge.shareFeedback==='function'){
   window.NativeBridge.shareFeedback('知余记账反馈：'+item.title,body);
 }else if(navigator.share){
   navigator.share({title:'知余记账反馈',text:body}).catch(()=>toast('已保存在本机，尚未发送'));
 }else{
   const blob=new Blob([body],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download='知余记账-意见反馈-'+item.id+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
   toast('已导出反馈文本，请自行发送给开发者');
 }
}

function sendAI(mode,text){

if(!(cfg.configured||cfg.anyConfigured)){aiStatus='请先保存 API Key';setView('ai-settings');return}
aiBusy=true;aiMode=mode;aiPending='r'+Date.now()+Math.random().toString(36).slice(2,6);
try{window.NativeBridge.askAI(JSON.stringify({mode,text:text||'',id:aiPending}));if(view==='ai-chat'||view==='ai-settings')rerenderKeepScroll();else toast('AI 正在解析…')}catch(e){aiBusy=false;toast('无法调用模型：'+e.message)}

function parseAIBill(text){
const raw=String(text).trim();const first=raw.indexOf('{'),last=raw.lastIndexOf('}');
if(first<0||last<first)throw Error('没有可识别的账单 JSON');
const t=JSON.parse(raw.slice(first,last+1));if(t.error)throw Error(String(t.error));
const amount=Number(t.amount),kind=t.kind;
if(!Number.isFinite(amount)||amount<=0||amount>1e10||!['expense','income'].includes(kind))throw Error('金额或收支类型错误');
const valid=kind==='expense'?expenseCats:incomeCats;
const account=(data.assetAccounts||[]).find(a=>!a.deletedAt&&a.name===t.accountName);
return {amount:Math.round(amount*100)/100,kind,category:valid.some(a=>a[0]===t.category)?t.category:'其他',date:safeDate(t.date||'')?t.date:todayISO,note:String(t.note||aiDraft).slice(0,100),merchant:String(t.merchant||'').slice(0,50),accountId:account?account.id:''};
}

 if(e.ok){aiInputDrafts={};if(e.config&&e.config.provider)aiSelectedProvider=e.config.provider;}

 if(e.type==='saved'&&e.ok&&aiTestAfterSave){aiTestAfterSave=false;aiAutoTestAndModels=true;sendAI('test','');}

}

aiBusy=false;if(!e.ok){aiAutoTestAndModels=false;aiStatus=e.error||'请求失败';if(view==='ai-chat'||view==='ai-settings')rerenderKeepScroll();toast(aiStatus);return}

};

function parseText(text){const explicit=text.match(/(?:花(?:了)?|消费|付款?|付了|用了|支出|支付|收入|收到了?|收款|赚了?|进账|到账|¥|￥)\s*[¥￥]?\s*(\d+(?:\.\d{1,2})?)/i);const currency=text.match(/(?:[¥￥]\s*)(\d+(?:\.\d{1,2})?)/);const suffix=text.match(/(\d+(?:\.\d{1,2})?)\s*(?:元|块钱?|rmb)/i);const numbers=[...text.matchAll(/\d+(?:\.\d{1,2})?/g)];const match=explicit||currency||suffix||(numbers.length===1?numbers[0]:null);if(!match||!Number.isFinite(Number(match[1]))||Number(match[1])<=0||Number(match[1])>1e10)return null;const income=/(收入|赚了|收到了|收到|工资|奖金|入账|返现|红包|退款)/.test(text);let cats=income?incomeCats:expenseCats;let category=income?'其他':'其他';const dictionary=income?[['工资',/工资|薪资|薪水/],['奖金',/奖金/],['兼职',/兼职/],['退款',/退款|退钱/],['红包',/红包/],['理财',/利息|理财/]]:[['餐饮',/吃|饭|早餐|午餐|晚餐|奶茶|咖啡|零食|外卖|餐厅/],['购物',/买|网购|衣服|鞋|超市|商场/],['交通',/打车|地铁|公交|油费|停车|高铁|机票/],['居住',/房租|水电|物业/],['医疗',/看病|医院|药/],['学习',/书|学习|课程/],['娱乐',/电影|游戏|唱歌|玩/],['通讯',/话费|流量/],['人情',/礼物|请客|随礼/],['宠物',/猫粮|狗粮|宠物/]];for(const [label,rule] of dictionary){if(rule.test(text)){category=label;break}}if(!cats.some(x=>x[0]===category))category='其他';return {amount:parseFloat(match[1]),kind:income?'income':'expense',category,note:text.trim().slice(0,100),date:todayISO}}

});
$('#screen').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const fn=action[el.dataset.action];if(fn)fn(el)});$('#nav-root').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action[el.dataset.action]?.(el)});$('#ai-root').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action[el.dataset.action]?.(el)});$('#ai-root').addEventListener('input',e=>{if(e.target.id==='ai-input')aiDraft=e.target.value});$('#ai-root').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ai-input')action['parse-ai']()});$('#modal-root').addEventListener('click',e=>{if(e.target.id==='overlay')return closeModal();const el=e.target.closest('[data-action]');if(el)action[el.dataset.action]?.(el)});$('#screen').addEventListener('change',e=>{if(e.target.id==='ai-provider'){const values=AI_PRESETS[e.target.value];if(values){$('#ai-base').value=values[0];$('#ai-model').value=values[1]}return}if(e.target.id==='io-book'){syncExportInputs();rerenderKeepScroll()}else if(['io-start','io-end'].includes(e.target.id)){syncExportInputs();rerenderKeepScroll()}});$('#screen').addEventListener('input',e=>{if(e.target.id==='search-field'){searchWord=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=renderSecondary();const next=tmp.querySelector('#search-results');const target=$('#search-results');if(next&&target)target.innerHTML=next.innerHTML}});$('#screen').addEventListener('keydown',e=>{const el=e.target.closest('[data-action="budget"]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openBudget()}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(!/\.json$/i.test(f.name)){await readSheetFile(f);return}if(f.size>10*1024*1024)throw Error('备份文件超过10MB');const d=JSON.parse(await f.text());if(!Array.isArray(d.transactions)||!Array.isArray(d.books)||!d.books.length||!d.books.every(b=>typeof b.id==='string'&&typeof b.name==='string')||!d.transactions.every(t=>typeof t.id==='string'&&typeof t.bookId==='string'&&['expense','income'].includes(t.kind)&&Number.isFinite(t.amount)&&t.amount>0&&safeDate(t.date)&&typeof t.category==='string'))throw Error('文件格式不符合账本备份要求');sheet('确认恢复账本',`<p class="ptext">检测到 <b>${d.books.length}</b> 个账本和 <b>${d.transactions.length}</b> 笔交易。导入会覆盖当前本地数据，请先导出已有备份。</p><div class="action-row"><button class="light-btn" data-action="close">取消</button><button class="gold-button" data-action="confirm-import">确认覆盖导入</button></div>`);action['confirm-import']=()=>{try{localStorage.setItem(recoveryKey,JSON.stringify(data));const incoming=normalizeData(d);localStorage.setItem(storeKey,JSON.stringify(incoming));data=incoming;closeModal();render();toast('账本已恢复；可在「数据与备份」撤销本次恢复')}catch(e){toast('恢复已取消：无法安全保存原账本和备份，请先导出 JSON 文件')}};}catch(err){toast('导入失败：'+err.message)}});
// Mobile/desktop account ordering: hold and drag the ☰ handle; buttons are an accessible fallback.
let draggingAccountId='';
function reorderAccounts(sourceId,targetId){if(!sourceId||!targetId||sourceId===targetId)return;const xs=data.assetAccounts;const start=xs.findIndex(a=>a.id===sourceId),end=xs.findIndex(a=>a.id===targetId);if(start<0||end<0)return;const [item]=xs.splice(start,1);xs.splice(end,0,item);save();rerenderKeepScroll()}
$('#screen').addEventListener('pointerdown',e=>{const grip=e.target.closest('.account-sort-grip');if(!grip||!accountEditMode)return;draggingAccountId=grip.dataset.dragId;try{grip.setPointerCapture(e.pointerId)}catch{}});
$('#screen').addEventListener('pointerup',e=>{if(!draggingAccountId)return;const id=draggingAccountId;draggingAccountId='';const row=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-account-row]');if(row)reorderAccounts(id,row.dataset.accountRow)});
$('#screen').addEventListener('pointercancel',()=>{draggingAccountId=''});
$('#screen').addEventListener('dragstart',e=>{const el=e.target.closest('.account-sort-grip');if(!el||!accountEditMode)return;draggingAccountId=el.dataset.dragId;e.dataTransfer?.setData('text/plain',draggingAccountId)});
$('#screen').addEventListener('dragover',e=>{if(draggingAccountId&&e.target.closest('[data-account-row]'))e.preventDefault()});
$('#screen').addEventListener('drop',e=>{const row=e.target.closest('[data-account-row]');if(!row||!draggingAccountId)return;e.preventDefault();const id=draggingAccountId;draggingAccountId='';reorderAccounts(id,row.dataset.accountRow)});

Object.assign(action,{
 'support-back':()=>setView('mine'),
 'tx-trash':()=>setView('tx-trash'),
 'data-protection':showDataProtection,
 'restore-tx':el=>{const id=el.dataset.id,record=(data.deletedTransactions||[]).find(t=>t.id===id);if(!record)return toast('账单不存在');if(data.transactions.some(t=>t.id===id))return toast('账单 ID 已存在，无法自动恢复');if(!data.books.some(b=>b.id===record.bookId))return toast('原账本已不存在，无法恢复');const {...restored}=record;delete restored.deletedAt;data.transactions.push(restored);data.deletedTransactions=data.deletedTransactions.filter(t=>t.id!==id);save();rerenderKeepScroll();toast('账单已恢复')},
 'permanent-delete-tx':el=>{const id=el.dataset.id;sheet('确认永久删除',`<p class="ptext">永久删除后不能从回收站恢复，建议先导出完整备份。</p><div class="action-row"><button class="light-btn" data-action="close">取消</button><button class="clear-btn" data-action="confirm-permanent-delete-tx" data-id="${esc(id)}">永久删除</button></div>`)},
 'confirm-permanent-delete-tx':el=>{data.deletedTransactions=(data.deletedTransactions||[]).filter(t=>t.id!==el.dataset.id);save();closeModal();rerenderKeepScroll();toast('账单已永久删除')},
 'restore-previous':()=>{let stored;try{stored=localStorage.getItem(recoveryKey)}catch{}if(!stored)return toast('未发现可恢复的数据');sheet('撤销上次覆盖恢复',`<p class="ptext">将撤销最近一次 JSON 备份导入，并用导入前的数据覆盖当前账本。此操作仍会覆盖新修改的内容，请先导出当前备份。</p><div class="action-row"><button class="light-btn" data-action="close">取消</button><button class="clear-btn" data-action="confirm-restore-previous">确认撤销</button></div>`)},
 'confirm-restore-previous':()=>{try{const old=localStorage.getItem(recoveryKey);if(!old)throw Error('恢复副本不存在');const restored=normalizeData(JSON.parse(old));const now=JSON.stringify(data);localStorage.setItem(recoveryKey,now);localStorage.setItem(storeKey,JSON.stringify(restored));data=restored;closeModal();setView('mine');toast('已恢复至上次导入前的数据')}catch(e){toast('撤销失败：'+e.message)}},
 'feedback-submit':()=>{
   const type=$('#feedback-category')?.value||'其他建议';
   const title=$('#feedback-title')?.value.trim()||'';
   const body=$('#feedback-body')?.value.trim()||'';
   if(!FEEDBACK_TYPES.includes(type))return toast('请选择反馈类型');
   if(title.length<4||title.length>80)return toast('请填写 4 至 80 字的标题');
   if(body.length<10||body.length>2000)return toast('请填写 10 至 2000 字的反馈内容');
   const item={id:'fb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      type,title,body,date:new Date().toLocaleString('zh-CN',{hour12:false})};
   data.feedbackHistory=feedbackHistory().slice(-99);
   data.feedbackHistory.push(item);
   save();
   render();
   toast('反馈已保存在本机，请选择系统应用完成发送');
   shareFeedbackRecord(item);
 },
 'feedback-share':el=>{const item=feedbackHistory().find(e=>e.id===el.dataset.id);shareFeedbackRecord(item)}
});

window.androidBack=()=>{if($('#overlay'))closeModal();else if(['import','export','import-history','import-help','ai-settings','feedback','help-center'].includes(view))setView('mine');else if(view!=='home')setView('home')};render();
})();
</script>
